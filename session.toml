# Config for the cliamp player session only, selected via HERDR_CONFIG_PATH in
# cliamp.sh. It never touches your own herdr config.
#
# Deliberately minimal: it sets only what the float needs, so nothing here
# overrides a preference of yours that the float has no business changing.
#
# IMPORTANT -- HERDR_CONFIG_PATH replaces a config rather than merging with one,
# so anything omitted below falls back to herdr's DEFAULTS, not to your settings.
# That means the float uses herdr's default ctrl+b prefix (detach: ctrl+b d). To
# make it match your own keybindings, copy this file to
#   "$(herdr plugin config-dir herdr-cliamp)/session.toml"
# and add your [keys] block; a copy there takes precedence over this one.

[ui]
# One pane, so there is nothing to navigate and no tab strip worth the rows.
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
hide_tab_bar_when_single_tab = true

[experimental]
# The float attaches to this session from inside a herdr-managed pane, which
# herdr refuses unless nesting is allowed. Also required in your OWN config --
# see the README's Setup step.
allow_nested = true
